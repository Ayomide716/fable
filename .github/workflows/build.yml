name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/fable-launcher.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fable-launcher-apk
          path: dist/fable-launcher.apk

      # Publish a GitHub Release by pushing a tag like v0.1.0,
      # or by running this workflow manually with a version.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Fable ${{ inputs.version || github.ref_name }}
          files: dist/fable-launcher.apk
          generate_release_notes: true
